# Generated by `make dashboards-generate` (observability/dashboards/src/build.py). Do not edit.
# Argo CD syncs this directory into the monitoring namespace; the kube-prometheus-stack Grafana sidecar
# loads every ConfigMap labelled grafana_dashboard: "1", and puts it in the folder named by grafana_folder
# when the sidecar's folderAnnotation is set to grafana_folder.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Tasuki
configMapGenerator:
  - name: dashboard-tasuki-overview
    files:
      - generated/tasuki-overview.json
  - name: dashboard-tasuki-service-red
    files:
      - generated/tasuki-service-red.json
  - name: dashboard-tasuki-location
    files:
      - generated/tasuki-location.json
  - name: dashboard-tasuki-orders
    files:
      - generated/tasuki-orders.json
  - name: dashboard-tasuki-slos
    files:
      - generated/tasuki-slos.json
  - name: dashboard-tasuki-simulator
    files:
      - generated/tasuki-simulator.json
