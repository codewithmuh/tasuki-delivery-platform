# ETA quality (docs/design.md §7.1, §10). `make slo-check` validates and unit-tests this file.
# Two layers can fall back to a rough ETA, so one alert name has one rule per layer (label `component`):
#
#   orders    orders_quotes_created_total{eta_source="dispatch"|"fallback"} (services/orders/src/core/metrics.py):
#             the quote used orders' local estimate because dispatch's GET /v1/eta did not answer in time.
#   dispatch  dispatch_eta_requests_total{source="osrm"|"fallback"} (confirmed by the dispatch service): one per
#             road-time lookup; fallback = straight-line distance × a Tokyo detour factor because OSRM failed.
groups:
  - name: tasuki-eta
    rules:
      - alert: ETAFallbackHigh
        expr: |
          sum(rate(orders_quotes_created_total{namespace="tasuki-prod", eta_source="fallback"}[10m]))
          /
          sum(rate(orders_quotes_created_total{namespace="tasuki-prod"}[10m]))
          > 0.1
        for: 10m
        labels:
          severity: ticket
          category: degradation
          component: orders
        annotations:
          title: "quotes are using the local ETA estimate"
          summary: "{{ $value | humanizePercentage }} of quotes did not get an ETA from dispatch (limit 10 %)."
          description: "Quotes are less accurate; check dispatch GET /v1/eta. ETA accuracy (business SLO) will suffer."
          runbook_url: "https://github.com/codewithmuh/tasuki-delivery-platform/blob/main/docs/runbooks/eta-fallback.md"

      - alert: ETAFallbackHigh
        expr: |
          sum(rate(dispatch_eta_requests_total{namespace="tasuki-prod", source="fallback"}[10m]))
          /
          sum(rate(dispatch_eta_requests_total{namespace="tasuki-prod"}[10m]))
          > 0.1
        for: 10m
        labels:
          severity: ticket
          category: degradation
          component: dispatch
        annotations:
          title: "dispatch is quoting ETAs without road times"
          summary: "{{ $value | humanizePercentage }} of ETAs use the straight-line fallback (limit 10 %)."
          description: "OSRM is failing; quotes and assignments are less accurate. ETA accuracy (business SLO) will suffer."
          runbook_url: "https://github.com/codewithmuh/tasuki-delivery-platform/blob/main/docs/runbooks/eta-fallback.md"
