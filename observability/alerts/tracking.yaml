# Tracking SSE health (docs/design.md §7.2, §10). `make slo-check` validates and unit-tests this file.
#
# Metrics (services/fleet/internal/tracking/feed.go), all labelled stream = track (customers) | fleet (ops console):
#   tracking_event_age_seconds_count     position events written to viewers (the freshness histogram's count)
#   tracking_sse_dropped_events_total    events dropped because a viewer read too slowly and its buffer was full
#   tracking_sse_connections             open SSE streams
# Brownout skips (tracking_sse_throttled_events_total) are deliberate and are not drops.
groups:
  - name: tasuki-tracking
    rules:
      # Dropped events are never sent, so the tracking freshness SLI cannot see them.
      - alert: TrackingSSEDropsHigh
        expr: |
          sum(rate(tracking_sse_dropped_events_total{namespace="tasuki-prod"}[10m]))
          /
          (
            sum(rate(tracking_event_age_seconds_count{namespace="tasuki-prod"}[10m]))
            + sum(rate(tracking_sse_dropped_events_total{namespace="tasuki-prod"}[10m]))
          )
          > 0.02
        for: 15m
        labels:
          severity: ticket
          category: saturation
        annotations:
          title: "tracking is dropping position events"
          summary: "{{ $value | humanizePercentage }} of position events were dropped for slow viewers (limit 2 %)."
          description: "Viewers see the courier jump or freeze; the freshness SLO does not count dropped events."
          runbook_url: "https://github.com/codewithmuh/tasuki-delivery-platform/blob/main/docs/runbooks/tracking-sse-drops.md"

      # Tracking has no consumer group, so no Kafka lag. A replica that stops reading courier.locations sends nothing,
      # and the freshness SLO goes quiet instead of burning. A fleet-stream viewer (the ops console) receives every
      # courier, so a replica holding one while fleet-ingest accepts points must be sending events. If it is not, it
      # has stalled. Pages for the same reason as KafkaConsumerLagHigh.
      - alert: TrackingFeedStalled
        expr: |
          (
            sum by (pod) (tracking_sse_connections{namespace="tasuki-prod", stream="fleet"}) > 0
            unless on (pod)
            sum by (pod) (rate(tracking_event_age_seconds_count{namespace="tasuki-prod", stream="fleet"}[5m])) > 0
          )
          and on ()
          sum(rate(fleet_ingest_points_total{namespace="tasuki-prod", result="accepted"}[5m])) > 0
        for: 5m
        labels:
          severity: page
          category: backlog
        annotations:
          title: "tracking replica {{ $labels.pod }} has stopped sending positions"
          summary: "{{ $labels.pod }} holds ops-console streams but sent no position events for 5 minutes while couriers are reporting."
          description: "Every viewer on this replica sees a frozen map."
          runbook_url: "https://github.com/codewithmuh/tasuki-delivery-platform/blob/main/docs/runbooks/tracking-feed-stalled.md"
