# Health of the rollout gate itself (tools/rollout-gate). `make slo-check` validates and unit-tests this file.
# Metric: rollout_gate_decisions_total{allowed,cause}, cause = budget | no_data | prometheus_error.
groups:
  - name: tasuki-rollout-gate
    rules:
      # The gate fails closed by default: when it cannot read a budget, canaries are blocked. That is safe but
      # stops deploys, so a human must know why.
      - alert: RolloutGateBudgetUnknown
        expr: sum by (cause) (increase(rollout_gate_decisions_total{cause=~"no_data|prometheus_error"}[15m])) > 0
        labels:
          severity: ticket
          category: delivery
        annotations:
          title: "rollout gate cannot read an error budget ({{ $labels.cause }})"
          summary: "In the last 15 minutes the gate decided without an error budget (cause: {{ $labels.cause }})."
          description: "Canaries are blocked while the gate fails closed. Fix Prometheus or the SLO name in the AnalysisTemplate."
          runbook_url: "https://github.com/codewithmuh/tasuki-delivery-platform/blob/main/docs/runbooks/rollout-gate-budget-unknown.md"
