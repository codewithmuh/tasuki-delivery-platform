# Platform plumbing that every service depends on: secrets and progressive delivery.
# `make slo-check` validates and unit-tests this file.
#
# Not duplicated here: kube-prometheus-stack's defaults already cover pods that crash-loop (KubePodCrashLooping),
# stay Pending or unready (KubePodNotReady, which includes CreateContainerConfigError and unschedulable pods),
# wait on a container (KubeContainerWaiting), and Deployments that stop progressing (KubeDeploymentRolloutStuck),
# all with `for: 15m` (1 h for KubeContainerWaiting) and severity warning, which the Alertmanager routes to the
# ticket channel. docs/runbooks/README.md maps them to Tasuki runbooks. What they do not cover is below.
#
# Label collision: both controllers export their own `namespace` label (the object's namespace) and are scraped
# from their own namespace. When the ServiceMonitor does not honour labels, Prometheus renames the object's label
# to exported_namespace. label_replace copies it back, so `namespace` always names the object's namespace and the
# routing (tasuki-dev → ticket) works. When the label already arrives as `namespace`, label_replace changes nothing.
groups:
  - name: tasuki-platform
    rules:
      # External Secrets cannot sync an ExternalSecret: Secrets Manager unreachable, IAM (Pod Identity) broken, the
      # secret deleted, or, since tasuki-app lists every key with remoteRef.property (deploy/apps/base), a key
      # missing from tasuki/<env>/app (GD-07 variant A). External Secrets keeps the last good Kubernetes Secret, so
      # running and new pods are unaffected for now; but a rotation never arrives, and a bad edit waits in Secrets
      # Manager to break the next sync that works. All namespaces (the monitoring ExternalSecrets too).
      # Metric: externalsecret_status_condition{name,namespace,condition,status} (External Secrets v2.12, ServiceMonitor).
      - alert: ExternalSecretSyncFailing
        expr: |
          max by (namespace, name) (
            label_replace(
              externalsecret_status_condition{condition="Ready", status="False"},
              "namespace", "$1", "exported_namespace", "(.+)"
            )
          ) == 1
        for: 10m
        labels:
          severity: ticket
          category: configuration
        annotations:
          title: "ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} cannot sync"
          summary: "{{ $labels.name }} has been not Ready for 10 minutes; the Kubernetes Secret keeps its last good values."
          description: "Secret changes (rotations, new keys) do not reach the cluster until this is fixed."
          runbook_url: "https://github.com/codewithmuh/tasuki-delivery-platform/blob/main/docs/runbooks/broken-secret-stuck-rollout.md"

      # An Argo Rollout (orders, fleet-ingest, tracking and dispatch in tasuki-prod) is Degraded: the canary was
      # aborted (by the error-budget gate's analysis, or by hand), or the new pods did not become available within
      # progressDeadlineSeconds (a missing secret key, a bad image, a failing probe). The stable pods keep serving,
      # so users may see nothing; the release is stuck until someone reverts or fixes it in git.
      # kube-prometheus-stack's KubeDeploymentRolloutStuck does not see Rollouts; this is its equivalent.
      # Metric: rollout_info{namespace,name,phase,...} = 1 for the current phase (Argo Rollouts controller).
      - alert: RolloutDegraded
        expr: |
          max by (namespace, name) (
            label_replace(
              rollout_info{phase="Degraded"},
              "namespace", "$1", "exported_namespace", "(.+)"
            )
          ) == 1
        for: 5m
        labels:
          severity: ticket
          category: delivery
        annotations:
          title: "rollout {{ $labels.namespace }}/{{ $labels.name }} is Degraded"
          summary: "The {{ $labels.name }} Rollout was aborted or stopped progressing; the stable version is still serving."
          description: "The release is stuck. Find out whether the gate aborted it (error budget) or the new pods cannot start."
          runbook_url: "https://github.com/codewithmuh/tasuki-delivery-platform/blob/main/docs/runbooks/broken-secret-stuck-rollout.md"
