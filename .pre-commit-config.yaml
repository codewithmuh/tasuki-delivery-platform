# Fast, offline checks before every commit. Install once with `make setup` (runs `pre-commit install`).
# The slower per-area checks (tests, golangci-lint, tflint, deploy-lint) run with `make check` and in CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents] # Kubernetes manifests in deploy/
        exclude: ^deploy/charts/.*/templates/ # Helm templates are not YAML until rendered
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # orders (services/orders): the same ruff as `uv run ruff`, with its pyproject.toml settings.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # infra/: needs terraform on PATH (CI pins 1.16.5).
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.2
    hooks:
      - id: terraform_fmt

  # Go modules (services/fleet, services/simulator, tools/rollout-gate): needs gofmt on PATH.
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: bash -c 'out=$(gofmt -l "$@"); test -z "$out" || { echo "$out"; echo "not gofmt-formatted (make fmt)"; exit 1; }' --
        language: system
        types: [go]
