# Kyverno (kyverno.github.io/kyverno). The policies are Deny in the Tasuki namespaces, so an admission
# controller outage blocks pod creation there (not elsewhere: webhooks are scoped per policy).
# Two replicas keep admission working through a node drain or a restart.
admissionController:
  replicas: 2
  # Chart default: minAvailable 1.
  podDisruptionBudget:
    enabled: true
  container:
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits: {memory: 384Mi}
  serviceMonitor:
    enabled: true

backgroundController:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
  serviceMonitor:
    enabled: true

cleanupController:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 128Mi}
  serviceMonitor:
    enabled: true

reportsController:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
  # require-probes also matches Argo Rollouts (the prod canaries). Kyverno cannot grant itself access to a
  # custom resource, so the background scan needs read access here, or Rollouts never show up in PolicyReports.
  rbac:
    clusterRole:
      extraResources:
        - apiGroups: [argoproj.io]
          resources: [rollouts]
  serviceMonitor:
    enabled: true
