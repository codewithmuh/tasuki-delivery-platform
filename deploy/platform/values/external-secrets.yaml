# External Secrets Operator (charts.external-secrets.io).

# Must match the Pod Identity association in infra/platform/pod-identity.tf.
serviceAccount:
  name: external-secrets

resources:
  requests: {cpu: 25m, memory: 64Mi}
  limits: {memory: 256Mi}
webhook:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
certController:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}

serviceMonitor:
  enabled: true
