# Loki (grafana-community/helm-charts; Grafana moved the OSS chart there in March 2026).
# Monolithic: one pod, logs on a gp3 volume. Enough for a dev cluster's few GB a day; the step up is
# Distributed mode on S3.
deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 72h
    # OTLP log attributes the collector sends (k8s.namespace.name, ...) become these index labels.
    allow_structured_metadata: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  # Pattern ingester and the bloom stack are for large installs.
  pattern_ingester:
    enabled: false

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: gp3
    size: 10Gi
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}
  extraEnv:
    - name: GOMEMLIMIT
      value: 900MiB

# Every other deployment mode's components off.
backend: {replicas: 0}
read: {replicas: 0}
write: {replicas: 0}
ingester: {replicas: 0}
querier: {replicas: 0}
queryFrontend: {replicas: 0}
queryScheduler: {replicas: 0}
distributor: {replicas: 0}
compactor: {replicas: 0}
indexGateway: {replicas: 0}
bloomGateway: {replicas: 0}
bloomPlanner: {replicas: 0}
bloomBuilder: {replicas: 0}

# Caches (memcached) default to several GiB of memory; a single binary does not need them.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Clients talk to the Loki Service directly; no nginx gateway, canary, self-test or MinIO.
gateway:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
rollout_operator:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: true
