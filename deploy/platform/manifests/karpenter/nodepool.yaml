# What Karpenter may launch, and when it may take nodes away.
# Node autoscaler: Karpenter over Cluster Autoscaler (ADR 0012).
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    metadata:
      labels:
        node-pool: general
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        # Spot first: with both capacity types allowed, Karpenter picks spot (price-capacity-optimized) and
        # falls back to on-demand only when no spot capacity is available. design.md §10, rain surge.
        - key: karpenter.sh/capacity-type
          operator: In
          values: [spot, on-demand]
        # Graviton and x86. Many instance types across both make spot interruptions and shortages rare.
        - key: kubernetes.io/arch
          operator: In
          values: [arm64, amd64]
        - key: kubernetes.io/os
          operator: In
          values: [linux]
        # Compute, general purpose and memory optimised, 6th generation or newer.
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: [c, m, r]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
        # No tiny nodes (per-node overhead) and no huge ones (one interruption takes too much with it).
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: [large, xlarge, 2xlarge]
      # Replace every node at least weekly: new AMI, fresh kernel, no long-lived snowflakes.
      expireAfter: 168h
      # A drain blocked by a PodDisruptionBudget is forced after this long, so expiry always completes.
      terminationGracePeriod: 1h
  # Cost guard: Karpenter never runs more than this in total, whatever the pending pods ask for.
  limits:
    cpu: "32"
    memory: 128Gi
  disruption:
    # Pack pods onto fewer, cheaper nodes when there is slack, not only when a node is empty.
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
    # Voluntary disruption (consolidation, drift, expiry) touches at most 1 node at a time.
    budgets:
      - nodes: "1"
