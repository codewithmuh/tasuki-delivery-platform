# No auth block: the operator uses its own EKS Pod Identity credentials (read-only on tasuki/*).
# Region is fixed: personal data and its secrets stay in Tokyo (design.md §11).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: tasuki-dev
spec:
  conditions:
    - namespaces: [tasuki-dev]
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-1
      # An ExternalSecret asking for key "app" reads Secrets Manager secret "tasuki/dev/app".
      prefix: tasuki/dev/
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: tasuki-prod
spec:
  conditions:
    - namespaces: [tasuki-prod]
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-1
      prefix: tasuki/prod/
---
# Cluster-wide tooling in the monitoring namespace (one Alertmanager serves both environments), with its own
# prefix: tasuki/monitoring/alertmanager holds the Slack webhook (deploy/README.md, "Alerting").
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: tasuki-monitoring
spec:
  conditions:
    - namespaces: [monitoring]
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-1
      prefix: tasuki/monitoring/
