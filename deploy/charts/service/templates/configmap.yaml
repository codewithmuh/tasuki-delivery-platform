{{- with .Values.files }}
# Files for the long-running pods (values.yaml "files"), mounted read-only at filesMountPath.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "service.name" $ }}-files
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "service.labels" $ | nindent 4 }}
data:
  {{- toYaml . | nindent 2 }}
{{- end }}
