# Defaults for every Tasuki service. Per-service values: deploy/apps/services/<release>.yaml.
# Per-environment values: deploy/apps/overlays/<env>/values/. The runtime contract these defaults
# implement is in docs/architecture.md ("Runtime contract (every service)").

image:
  # Required. ghcr.io/codewithmuh/tasuki-delivery-platform/<service>
  repository: ""
  # Required, and never "latest": Kyverno rejects mutable tags (deploy/policies/).
  tag: ""
  pullPolicy: IfNotPresent

# The image's entrypoint/cmd are used when these are empty.
command: []
args: []

# Ignored when autoscaling.enabled (the HPA owns the replica count then).
replicas: 2
revisionHistoryLimit: 5

# One container port named "http": API traffic, /healthz, /readyz and, unless metrics.port is set, /metrics.
port: 8080

service:
  # Callers use http://<release> (port 80) inside the namespace.
  port: 80

metrics:
  # Set when /metrics is served on its own port (orders workers use 9100).
  port: null
  path: /metrics
  serviceMonitor:
    enabled: true
    interval: 30s

probes:
  # Liveness never checks dependencies. Readiness is each service's call (runtime contract): orders keeps
  # answering 503 through a short database outage (a grace window), fleet-ingest ignores Kafka and sheds load.
  liveness:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    httpGet:
      path: /readyz
      port: http
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 2
  # Holds liveness/readiness back until the process is up: 30 x 2 s = 60 s to start.
  startup:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 2
    timeoutSeconds: 2
    failureThreshold: 30

# Graceful shutdown. On delete, the kubelet runs preStop (a plain sleep while the endpoint is removed from
# Services and load balancers), then sends SIGTERM; the app fails readiness and drains for up to
# shutdownDrainSeconds (20 s in the runtime contract). The chart refuses to render if
# preStopSleepSeconds + shutdownDrainSeconds > terminationGracePeriodSeconds.
preStopSleepSeconds: 5
shutdownDrainSeconds: 20
terminationGracePeriodSeconds: 30

resources:
  # No CPU limit on purpose: it only throttles. The memory limit protects the node; Kyverno requires it.
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

# Telemetry. Sets the standard OpenTelemetry SDK variables (OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_SERVICE_NAME,
# OTEL_RESOURCE_ATTRIBUTES) and opens egress to the collector, which runs on every node. Empty: off.
otlp:
  endpoint: http://otel-collector.monitoring:4318
  collectorSelector:
    app.kubernetes.io/name: opentelemetry-collector

# Plain environment variables: NAME: value. A map (not a list) so environment files can override one key.
env: {}
# Environment variables from Secrets: NAME: {secret: <secret name>, key: <key>}.
# tasuki-app is synced from AWS Secrets Manager by External Secrets (deploy/apps/base/external-secret.yaml).
secretEnv: {}

# Service images are multi-arch (release.yml builds amd64 and arm64), so pods can land on any Karpenter node,
# including cheaper Graviton ones. Set a selector per service only if it truly needs one.
nodeSelector: {}

podSecurityContext:
  runAsNonRoot: true
  # Numeric on purpose: Kubernetes cannot verify runAsNonRoot for a named user such as distroless "nonroot".
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# The root filesystem is read-only, so /tmp is the only writable path.
tmpVolume:
  sizeLimit: 64Mi

serviceAccount:
  # No Tasuki service talks to the Kubernetes API in P1, so pods get no API token.
  automountToken: false
  annotations: {}

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  # HorizontalPodAutoscaler behavior (autoscaling/v2), passed through as is. Empty: Kubernetes' defaults
  # (scale up at once, scale down after a 5-minute window).
  behavior: {}

# Argo Rollouts canary instead of a Deployment (controller: deploy/platform/argo-rollouts.yaml). Off by default;
# prod turns it on per service in deploy/apps/overlays/prod/values/. There is no traffic router, so the Service
# splits traffic by pod count: setWeight 25 with 2 replicas means 1 canary pod next to 2 stable ones.
# Only updates run the steps: the first version of a Rollout goes straight to 100 %.
rollout:
  enabled: false
  # Step 1, before any traffic moves: ask the error-budget gate (tools/rollout-gate) through the
  # ClusterAnalysisTemplate error-budget-gate. A spent budget fails the analysis, the Rollout aborts and the
  # stable pods keep serving (docs/slo/error-budget-policy.md).
  gate:
    enabled: true
    # Sloth service whose budget decides (observability/slo/specs/). Empty: the release name.
    service: ""
    # One SLO of that service. Empty: all of them, because the policy freezes a service when any budget is spent.
    slo: ""
    # Record the gate's answer without acting on it: for a service whose SLO has no data yet.
    dryRun: false
  # The steps after the gate.
  steps:
    - setWeight: 25
    - pause: {duration: 5m}
    - setWeight: 50
    - pause: {duration: 5m}
  # Going back to one of the last N revisions skips the steps and the gate: a rollback never waits for a budget.
  # Must not exceed revisionHistoryLimit, or the old ReplicaSet is already gone.
  rollbackWindowRevisions: 3

# Read-only files for the long-running pods, from a ConfigMap: file name -> content, mounted at filesMountPath.
# Not mounted in the PreSync Job, which runs before the ConfigMap exists on a first sync. The simulator uses it
# for a scenario that is not built in (SCENARIO=/etc/tasuki/<file>).
files: {}
filesMountPath: /etc/tasuki

pdb:
  enabled: true
  # maxUnavailable (not minAvailable) so a single-replica dev Deployment never blocks a node drain.
  maxUnavailable: 1

# Spread replicas across zones (one AZ loss, design §10) and, softly, across nodes.
topologySpread:
  enabled: true
  zoneWhenUnsatisfiable: DoNotSchedule
  hostWhenUnsatisfiable: ScheduleAnyway

networkPolicy:
  enabled: true
  # Namespace of the Prometheus that scrapes /metrics (kube-prometheus-stack).
  monitoringNamespace: monitoring
  # Extra peers allowed to reach the http port, e.g. [{podSelector: {matchLabels: {app.kubernetes.io/name: orders}}}].
  allowFrom: []
  # Egress besides DNS. Raw NetworkPolicyEgressRule objects (to + ports).
  egress: []

ingress:
  enabled: false
  className: alb
  host: ""
  path: /
  # Source of ALB traffic for the NetworkPolicy: the public subnets in infra/platform/vpc.tf
  # (10.40.96.0/24, .97.0/24, .98.0/24). Pods live in the private /19s, so this does not open pod-to-pod.
  albSourceCidrs:
    - 10.40.96.0/22
  # One ALB per environment (group.name), shared by every service's Ingress, keeps the bill down.
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /readyz
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30

# Argo CD PreSync hook Job, run before every sync with the same image, env and security context
# (orders: `python manage.py migrate --noinput`). Django has no migration lock, so not at startup.
preSyncJob:
  enabled: false
  args: []
  backoffLimit: 2
  activeDeadlineSeconds: 300

# Scheduled jobs that share the service's image and env: name -> {schedule, args}.
cronJobs: {}

podAnnotations: {}
podLabels: {}
tolerations: []
affinity: {}
priorityClassName: ""
