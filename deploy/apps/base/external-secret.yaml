# The services' shared secrets, from AWS Secrets Manager: one JSON secret per environment,
# tasuki/<env>/app, with the keys listed in deploy/README.md. The overlay picks the store
# (ClusterSecretStore tasuki-dev or tasuki-prod, each locked to its own namespace and prefix).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tasuki-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: set-by-overlay
  target:
    name: tasuki-app
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: app
