# The services' shared secrets, from AWS Secrets Manager: one JSON secret per environment, tasuki/<env>/app.
# The overlay picks the store (ClusterSecretStore tasuki-dev or tasuki-prod, each locked to its own namespace
# and prefix).
#
# Every key the services read is listed here, once (deploy/README.md, "Secrets"), with an explicit property
# instead of `dataFrom.extract`. A key missing from Secrets Manager then fails the sync (Ready=False, reason
# SecretSyncedError, and the tasuki-<env> Application goes Degraded) and the last good Kubernetes Secret stays
# in place, instead of a Secret without that key reaching the pods. A new key goes here and in the README table.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tasuki-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: set-by-overlay
  target:
    name: tasuki-app
    creationPolicy: Owner
  data:
    - secretKey: DJANGO_SECRET_KEY
      remoteRef: {key: app, property: DJANGO_SECRET_KEY}
    - secretKey: ORDERS_FIELD_KEY
      remoteRef: {key: app, property: ORDERS_FIELD_KEY}
    - secretKey: COURIER_TOKEN_SECRET
      remoteRef: {key: app, property: COURIER_TOKEN_SECRET}
    - secretKey: TRACKING_TOKEN_SECRET
      remoteRef: {key: app, property: TRACKING_TOKEN_SECRET}
    - secretKey: ADMIN_TOKEN
      remoteRef: {key: app, property: ADMIN_TOKEN}
    - secretKey: FLEET_STREAM_TOKEN
      remoteRef: {key: app, property: FLEET_STREAM_TOKEN}
