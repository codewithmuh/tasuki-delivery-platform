# Ingress is denied by default for every pod in the namespace. Each service's chart then allows its own
# callers (and denies its egress except what it needs); the data stores get their policies here.
# Kafka's are generated by Strimzi from the listener's networkPolicyPeers (kafka.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-db
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: orders-db
  policyTypes: [Ingress]
  ingress:
    # The orders processes (and their migration Job and CronJobs, which carry the same name label).
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [orders, orders-outbox-relay, orders-dispatch-consumer]
      ports:
        - port: 5432
    # Replication between instances, and their instance managers (status on 8000).
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: orders-db
      ports:
        - port: 5432
        - port: 8000
    # The CloudNativePG operator reads each instance's status.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9187
---
# A restore of orders-db into a new cluster called orders-db-restore (deploy/README.md, "Backups and restore";
# game day GD-08). It reads the backups from S3 (egress is not restricted), and needs only what the operator and
# Prometheus need; nothing in the namespace connects to it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-db-restore
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: orders-db-restore
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: orders-db-restore
      ports:
        - port: 5432
        - port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9187
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [fleet-state, dispatch]
      ports:
        - port: 6379
---
# Prometheus scrapes Kafka brokers and the Kafka Exporter (consumer lag) on 9404.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-metrics
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: tasuki
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9404
