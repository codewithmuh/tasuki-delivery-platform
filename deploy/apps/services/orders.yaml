# orders API: Django + gunicorn (services/orders). Merchants and couriers call it; it writes orders and
# their outbox events to PostgreSQL in one transaction. The relay and the consumer are separate releases
# of the same image (orders-outbox-relay.yaml, orders-dispatch-consumer.yaml).
image:
  repository: ghcr.io/codewithmuh/tasuki-delivery-platform/orders
port: 8000

podSecurityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

env:
  LOG_LEVEL: info
  WEB_CONCURRENCY: "2"
  DISPATCH_URL: http://dispatch
  KAFKA_BROKERS: tasuki-kafka-bootstrap:9092
  # The code's defaults, spelled out because the probe below depends on them. A database connection attempt
  # gives up after 3 s; while the database is down, requests get 503 with Retry-After: 2; /readyz stays 200 for
  # the first 120 s of a database outage (a failover takes less), so pods keep answering 503 instead of
  # vanishing from the Service.
  DB_CONNECT_TIMEOUT_SECONDS: "3"
  DB_RETRY_AFTER_SECONDS: "2"
  READINESS_DB_GRACE_SECONDS: "120"
secretEnv:
  DATABASE_URL: {secret: orders-db-app, key: uri}
  DJANGO_SECRET_KEY: {secret: tasuki-app, key: DJANGO_SECRET_KEY}
  ORDERS_FIELD_KEY: {secret: tasuki-app, key: ORDERS_FIELD_KEY}
  COURIER_TOKEN_SECRET: {secret: tasuki-app, key: COURIER_TOKEN_SECRET}
  TRACKING_TOKEN_SECRET: {secret: tasuki-app, key: TRACKING_TOKEN_SECRET}
  # The seeding API (POST /v1/admin/*). The simulator is the only source of merchants and couriers in
  # both environments, so it is on in both. Switching it off means removing this line and the key from
  # deploy/apps/base/external-secret.yaml (which fails the sync if the key is missing from Secrets Manager).
  ADMIN_TOKEN: {secret: tasuki-app, key: ADMIN_TOKEN}

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 512Mi}

# /readyz may wait for one database connection attempt (DB_CONNECT_TIMEOUT_SECONDS, 3 s). With the chart's 2 s
# timeout, a database host that drops packets would fail readiness by probe timeout, whatever the grace window.
probes:
  readiness:
    timeoutSeconds: 4

# Schema migrations before every sync (Django has no migration lock, so never at pod start).
preSyncJob:
  enabled: true
  args: [python, manage.py, migrate, --noinput]

cronJobs:
  purge-expired:
    schedule: "0 * * * *"
    args: [python, manage.py, purge_expired]

networkPolicy:
  allowFrom:
    # Merchants and couriers, played by the simulator.
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: simulator
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: orders-db
      ports:
        - port: 5432
    # ETA and courier supply for quotes.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dispatch
      ports:
        - port: 8080
