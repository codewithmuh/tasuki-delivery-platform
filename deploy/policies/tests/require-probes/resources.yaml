apiVersion: apps/v1
kind: Deployment
metadata:
  name: skipped-platform-namespace
  namespace: monitoring
spec:
  selector:
    matchLabels: {app: other}
  template:
    metadata:
      labels: {app: other}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: quay.io/prometheus/prometheus:v3.7.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
# A prod canary: the same pod template as a Deployment, under kind Rollout.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: good-rollout
  namespace: tasuki-prod
spec:
  selector:
    matchLabels: {app: good-rollout}
  strategy:
    canary:
      steps:
        - setWeight: 25
  template:
    metadata:
      labels: {app: good-rollout}
    spec:
      containers:
        - name: app
          image: ghcr.io/codewithmuh/tasuki-delivery-platform/orders:0.1.0
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
---
