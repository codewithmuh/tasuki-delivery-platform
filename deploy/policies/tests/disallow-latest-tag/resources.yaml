apiVersion: v1
kind: Pod
metadata:
  name: good-tag
  namespace: tasuki-dev
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: app
      image: ghcr.io/codewithmuh/tasuki-delivery-platform/orders:0.1.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
---
apiVersion: v1
