apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: disallow-latest-tag
policies:
  - ../../disallow-latest-tag.yaml
resources:
  - resources.yaml
variables: ../values.yaml
results:
  - policy: disallow-latest-tag
    kind: Pod
    resources: [tasuki-dev/good-tag, monitoring/good-digest]
    result: pass
  - policy: disallow-latest-tag
    kind: Pod
    resources: [tasuki-dev/bad-latest, monitoring/bad-untagged, tasuki-dev/bad-init-container]
    result: fail
  - policy: disallow-latest-tag
    kind: Pod
    resources: [kube-system/skipped-system-namespace]
    result: skip
  - policy: disallow-latest-tag
    kind: Deployment
    resources: [tasuki-dev/bad-deployment]
    result: fail
