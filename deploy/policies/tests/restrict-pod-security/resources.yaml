# Each bad pod below differs from this one in exactly one field. Pod-level runAsNonRoot, container-level
# everything else: what deploy/charts/service renders.
apiVersion: v1
kind: Pod
metadata:
  name: good
  namespace: tasuki-dev
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: app
      image: ghcr.io/codewithmuh/tasuki-delivery-platform/tracking:0.1.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Pod
metadata:
  name: good-container-level-non-root
  namespace: tasuki-dev
spec:
  securityContext:
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: app
      image: ghcr.io/codewithmuh/tasuki-delivery-platform/tracking:0.1.0
