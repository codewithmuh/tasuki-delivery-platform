# Platform namespaces are out of scope (their charts are configured in deploy/platform/values/).
apiVersion: v1
kind: Pod
metadata:
  name: skipped-platform-namespace
  namespace: monitoring
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: app
      image: ghcr.io/codewithmuh/tasuki-delivery-platform/tracking:0.1.0
      securityContext:
        readOnlyRootFilesystem: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-deployment
  namespace: tasuki-dev
spec:
  selector:
    matchLabels: {app: x}
  template:
    metadata:
      labels: {app: x}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: ghcr.io/codewithmuh/tasuki-delivery-platform/tracking:0.1.0
          securityContext:
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
