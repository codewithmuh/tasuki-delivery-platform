apiVersion: v1
kind: Pod
metadata:
  name: good
  namespace: tasuki-dev
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile: {type: RuntimeDefault}
  initContainers:
    - name: init
      image: ghcr.io/codewithmuh/tasuki-delivery-platform/orders:0.1.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 64Mi}
  containers:
    - name: app
      image: ghcr.io/codewithmuh/tasuki-delivery-platform/orders:0.1.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {memory: 128Mi}
---
