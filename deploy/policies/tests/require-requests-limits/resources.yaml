# Platform namespaces are not in scope (their charts are sized in deploy/platform/values/).
apiVersion: v1
kind: Pod
metadata:
  name: skipped-platform-namespace
  namespace: monitoring
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: app
      image: quay.io/prometheus/node-exporter:v1.10.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bad-cronjob
  namespace: tasuki-dev
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile: {type: RuntimeDefault}
          restartPolicy: Never
          containers:
            - name: app
              image: ghcr.io/codewithmuh/tasuki-delivery-platform/orders:0.1.0
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
