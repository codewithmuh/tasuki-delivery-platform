name: ci

# Repository-wide checks. Each area has its own workflow with its lint, test and image jobs: orders.yml,
# fleet.yml, simulator.yml, console.yml, slo.yml (SLO rules + rollout gate), terraform.yml, deploy.yml.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; jobs ask for more only when they need it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repo-checks:
    name: Repo checks (workflows, secrets, misconfigurations)
    runs-on: ubuntu-24.04 # pinned: upgrade deliberately, not when GitHub moves "latest"
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the commits of a pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so secrets in older commits are found too
          persist-credentials: false
      - name: Lint GitHub workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - name: Compose file is valid with the placeholder settings (.env.example)
        run: docker compose --env-file .env.example --profile routing --profile sim config --quiet
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan files for vulnerabilities and misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0 # the action's default (v0.70.0) has a path-traversal advisory fixed in 0.71.1
          scan-type: fs
          scan-ref: .
          trivyignores: .trivyignore.yaml # deliberate findings, each scoped to a path with a reason
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
