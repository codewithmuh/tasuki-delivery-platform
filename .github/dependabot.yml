# Weekly, grouped updates so dependency PRs stay reviewable. Pinned action SHAs are updated too.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: uv
    directory: /services/api-python
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }

  - package-ecosystem: gomod
    directory: /services/api-go
    schedule: { interval: weekly }
    groups:
      go: { patterns: ["*"] }

  - package-ecosystem: docker
    directories: [/services/api-python, /services/api-go]
    schedule: { interval: weekly }
    groups:
      base-images: { patterns: ["*"] }
