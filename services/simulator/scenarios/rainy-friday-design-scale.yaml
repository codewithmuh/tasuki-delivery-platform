# Game day GD-02 at the design's full scale (docs/design.md §4): the rainy Friday surge with
# 10× the couriers and demand of rainy-friday.
#
#   demand   ~51,800 orders a day; 6,000 in the busiest hour (12 %). Rain from 11:30 triples it
#            to 18,000/h, about 5 orders/s, against roughly 7,200 deliveries/h of courier capacity.
#   couriers 4,600 on shifts, so about 3,000 are online at the lunch peak (10 % log off in the
#            rain), sending about 750 GPS points/s.
#
# FOR THE CLUSTER, NOT A LAPTOP. The simulator alone needs about 1–2 vCPU and 0.5–1 GiB (an
# estimate; see README "Design-scale game day"), and orders, dispatch, fleet-ingest and Kafka
# must be scaled to take the load. Use `small` locally.
name: rainy-friday-design-scale
description: Design-scale rainy Friday (GD-02), ~3,000 couriers online, ×3 demand from 11:30. Cluster only.
seed: 20261016
duration: 0s # the game day decides when to stop (SIGTERM, or -duration)

clock:
  start: "11:00" # begin just before the rain, whatever the real time is
  speedup: 1     # real speed: this is a load test, not a demo

wards: [chiyoda, chuo, minato, shinjuku, bunkyo, taito, sumida, koto, shinagawa, meguro, ota, setagaya,
        shibuya, nakano, suginami, toshima, kita, arakawa, itabashi, nerima, adachi, katsushika, edogawa]
ward_weights:
  minato: 1.5
  shibuya: 1.5
  shinjuku: 1.5
  chiyoda: 1.2
  chuo: 1.2
  setagaya: 1.3
ward_radius_m: 1500
merchants: 40
stores_per_ward: 10

couriers:
  count: 4600 # lunch + full-day shifts are 65 % of couriers: ~3,000 online at 12:00
  scooter_share: 0.3
  bicycle_kmh: 15
  scooter_kmh: 25
  shifts:
    - { start: "10:30", end: "14:30", share: 0.35 }
    - { start: "17:00", end: "21:30", share: 0.35 }
    - { start: "09:00", end: "21:00", share: 0.30 }
  accept:
    probability: 0.95
    halving_distance_m: 2000
  think_time: { min: 2s, max: 8s }

demand:
  curve: # normal-weekday's curve × 10
    - { at: "00:00", per_hour: 200 }
    - { at: "06:00", per_hour: 100 }
    - { at: "08:00", per_hour: 800 }
    - { at: "10:30", per_hour: 2000 }
    - { at: "11:30", per_hour: 5200 }
    - { at: "12:00", per_hour: 6000 }
    - { at: "13:00", per_hour: 6000 }
    - { at: "13:30", per_hour: 4500 }
    - { at: "15:00", per_hour: 2000 }
    - { at: "17:00", per_hour: 2500 }
    - { at: "18:00", per_hour: 4800 }
    - { at: "19:00", per_hour: 5600 }
    - { at: "20:30", per_hour: 4200 }
    - { at: "22:00", per_hour: 1500 }
    - { at: "23:30", per_hour: 400 }
  prep_time: { min: 5m, max: 15m }
  # 5 orders/s with 4 attempts of up to 5 s each during an outage is ~100–150 in flight; the
  # cap leaves room before orders fail as "backpressure".
  max_in_flight: 1000
  watch_share: 0.6 # ~3,600 tracking streams open at the lunch peak (design §4 sizes tracking for 10,000)

weather:
  - name: rain
    from: "11:30"
    to: "24:00"
    demand_multiplier: 3
    speed_multiplier: 0.85
    offline_share: 0.10

gps:
  moving_interval: 4s
  idle_interval: 15s
  noise_m: 8
