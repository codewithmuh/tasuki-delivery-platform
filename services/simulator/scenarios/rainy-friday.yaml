# The surge the platform is designed for (docs/design.md §4 and §10): rain starts at 11:30 on a
# Friday, demand triples, couriers ride 15 % slower and 10 % of them log off. Same city and
# fleet as normal-weekday, so the two runs can be compared directly. Expect longer ETAs, low
# courier supply in quotes and dispatch-speed SLO burn, but no order API errors.
name: rainy-friday
description: Rain from 11:30 triples demand; couriers are slower and 10 % go offline.
seed: 20261016
duration: 0s

clock:
  start: "11:00" # begin just before the rain, whatever the real time is
  speedup: 1

wards: [chiyoda, chuo, minato, shinjuku, bunkyo, taito, sumida, koto, shinagawa, meguro, ota, setagaya,
        shibuya, nakano, suginami, toshima, kita, arakawa, itabashi, nerima, adachi, katsushika, edogawa]
ward_weights:
  minato: 1.5
  shibuya: 1.5
  shinjuku: 1.5
  chiyoda: 1.2
  chuo: 1.2
  setagaya: 1.3
ward_radius_m: 1500
merchants: 12
stores_per_ward: 4

couriers:
  count: 400
  scooter_share: 0.3
  bicycle_kmh: 15
  scooter_kmh: 25
  shifts:
    - { start: "10:30", end: "14:30", share: 0.35 }
    - { start: "17:00", end: "21:30", share: 0.35 }
    - { start: "09:00", end: "21:00", share: 0.30 }
  accept:
    probability: 0.95
    halving_distance_m: 2000
  think_time: { min: 2s, max: 8s }

demand:
  curve: # the weekday curve with a slightly busier Friday evening
    - { at: "00:00", per_hour: 30 }
    - { at: "06:00", per_hour: 10 }
    - { at: "08:00", per_hour: 80 }
    - { at: "10:30", per_hour: 200 }
    - { at: "11:30", per_hour: 520 }
    - { at: "12:00", per_hour: 600 }
    - { at: "13:00", per_hour: 600 }
    - { at: "13:30", per_hour: 450 }
    - { at: "15:00", per_hour: 200 }
    - { at: "17:00", per_hour: 280 }
    - { at: "18:00", per_hour: 540 }
    - { at: "19:00", per_hour: 620 }
    - { at: "20:30", per_hour: 480 }
    - { at: "22:00", per_hour: 200 }
    - { at: "23:30", per_hour: 60 }
  prep_time: { min: 5m, max: 15m }
  max_in_flight: 400

weather:
  - name: rain
    from: "11:30"
    to: "24:00"
    demand_multiplier: 3    # ×3 orders
    speed_multiplier: 0.85  # couriers 15 % slower
    offline_share: 0.10     # 10 % of couriers log off when the rain starts

gps:
  moving_interval: 4s
  idle_interval: 15s
  noise_m: 8 # worse GPS under heavy cloud and between tall buildings
