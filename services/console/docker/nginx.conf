# Static file server for the console. Runs as the unprivileged nginx user on a read-only root
# filesystem: everything nginx writes (pid, temp files, rendered templates) goes to /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  # MapLibre's worker is an ES module (.mjs); browsers only run modules served as JavaScript.
  types {
    text/javascript mjs;
  }
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Log the path as requested (before the SPA fallback rewrites it to /index.html), except that
  # tracking links carry a bearer token in the path, which must never reach the logs.
  map $request_uri $log_path {
    ~^/track/ /track/[redacted];
    default $request_uri;
  }

  # One JSON line per request on stdout, with a request id (runtime contract).
  log_format json escape=json
    '{"time":"$time_iso8601","level":"info","msg":"request","request_id":"$request_id",'
    '"method":"$request_method","path":"$log_path","status":$status,'
    '"bytes":$body_bytes_sent,"duration_s":$request_time}';
  access_log /dev/stdout json;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

  # The server blocks, rendered at start from /etc/nginx/templates with the CONSOLE_* variables.
  include /tmp/tasuki/*.conf;
}
